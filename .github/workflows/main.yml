name: Node.js Frontend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  VITE_API_URL: ${{ secrets.VITE_API_URL }}
  VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
  VITE_APP_NAME: "Taskify ITP (CI)"
  VITE_ENV: production
  VITE_SHOW_QUERY_DEVTOOLS: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar entorno de Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "npm"

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Validar tipado estático de TypeScript
        run: npm run typecheck

      - name: Analizar calidad de código con Linter
        run: npm run lint

      - name: Ejecutar pruebas unitarias y de componentes (Vitest / Jest)
        run: npm run test

      - name: Pre-compilar aplicación para pruebas de integración
        run: npm run build

      - name: Instalar motores de navegación de Playwright (Solo Chromium)
        run: npx playwright install chromium --with-deps

      - name: Ejecutar pruebas de Extremo a Extremo (Playwright E2E)
        run: npm run test:e2e

      - name: Notificar Despliegue Automatizado a Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"